<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container Principal -->
    <div class="container" id="main-container">
        <!-- Divisão da esquerda -->
        <div class="left-panel">
            <h1 class="purg-title">Jinx <span class="beta-box">Beta</span></h1>
            <button id="usuariosButton" class="config-button">Usuários</button>
            <button id="resultadosButton" class="config-button">Resultados Financeiros</button>
            <button id="tokensButton" class="config-button">Tokens</button>
            <!-- Botão Sair -->
            <button id="logoutButton" class="logout-button">Sair</button>
        </div>

        <!-- Divisão central para exibir as informações  -->
        <div class="center-panel">
            <h2 class="bets-title"></h2>
            <div class="cards-container" id="cardsContainer">
                <!-- Cards serão preenchidos pelo JavaScript -->
            </div>
        </div>
    </div>

    <script src="usuarios.js" defer></script>
    <script src="resultados_financeiros.js" defer></script>
    <script src="resultados_financeiros_detalhes.js" defer></script>
    <script src="script.js" defer></script>
    <script src="autenticacao.js" defer></script>
    
    <script>
        function openChangePasswordModal() {
            const modalHtml = `
                <div id="passwordModal" style="display: block;">
                    <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                        <h2>Alterar Senha</h2>
                        <input type="password" id="newPassword" placeholder="Nova Senha" required />
                        <button onclick="changePassword()">Salvar</button>
                        <button onclick="closePasswordModal()">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            if (modal) {
                modal.remove();
            }
        }

        function changePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const firstUserId = document.querySelector('.user-card').getAttribute('data-id');

            if (newPassword) {
                fetch(`/api/usuarios/${firstUserId}/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: newPassword }),
                })
                .then(response => {
                    if (response.ok) {
                        alert('Senha alterada com sucesso!');
                        closePasswordModal();
                    } else {
                        alert('Erro ao alterar a senha.');
                    }
                })
                .catch(error => {
                    console.error('Erro ao alterar a senha:', error);
                    alert('Erro ao alterar a senha.');
                });
            } else {
                alert('Por favor, digite uma nova senha.');
            }
        }
    </script>
</body>
</html>
