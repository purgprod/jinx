<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container Principal -->
    <div class="container" id="main-container">
        <!-- Divisão da esquerda -->
        <div class="left-panel">
            <h1 class="purg-title">Jinx <span class="beta-box">Beta</span></h1>
            <button id="usuariosButton" class="config-button">Usuários</button>
            <button id="resultadosButton" class="config-button">Resultados Financeiros</button>
            <button id="tokensButton" class="config-button">Tokens</button>
            <button id="ecossistemaButton" class="config-button">Ecossistema</button>
	    <!-- <button id="receitasButton" class="config-button">Receitas</button> -->
            <button id="rotinasButton" class="config-button">Rotinas</button>
            <!-- Botão Sair -->
            <button id="logoutButton" class="logout-button">Sair</button>
        </div>

        <!-- Divisão central para exibir as informações -->
        <div class="center-panel">
            <h2 class="page-title"></h2>

            <!-- Botão Voltar -->
            <div id="voltarContainer" style="display: none;">
                <button class="button-novo" onclick="showUserCards()">Voltar para Cartões</button>
            </div>
        </div>
    </div>

    <!-- Carregar Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.5.1"></script>
    <!-- Carregar uma versão compatível do ChartDataLabels com Chart.js 3.x -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

    <script src="js/usuarios/usuarios.js" defer></script>
    <script src="js/tokens/tokens.js" defer></script>
    <script src="js/tokens/tokens_detalhes.js" defer></script>
    <script src="js/resultados_financeiros/resultados_financeiros.js" defer></script>
    <script src="js/resultados_financeiros/resultados_financeiros_detalhes.js" defer></script>
    <script type="module" src="js/resultados_financeiros/resultados_financeiros_novo.js" defer></script>
    <script src="js/autenticacao/autenticacao.js" defer></script>
    <script src="js/usuarios/criar_novo_usuario.js" defer></script>
    <script type="module" src="js/ecossistema/ecossistema.js" defer></script>
    <script type="module" src="js/receitas/receitas.js" defer></script>
    <script type="module" src="js/rotinas/rotinas.js" defer></script>
    <script type="module" src="js/usuarios/usuarios_detalhes.js" defer></script>
    <script src="script.js" defer></script>

</body>
</html>
