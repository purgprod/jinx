<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container Principal -->
    <div class="container" id="main-container">
        <!-- Divisão da esquerda -->
        <div class="left-panel">
            <h1 class="purg-title">Jinx <span class="beta-box">Beta</span></h1>
            <button id="usuariosButton" class="config-button">Usuários</button>
            <button id="resultadosButton" class="config-button">Resultados Financeiros</button>
            <button id="tokensButton" class="config-button">Tokens</button>
            <!-- Botão Sair -->
            <button id="logoutButton" class="logout-button">Sair</button>
        </div>

        <!-- Divisão central para exibir as informações  -->
        <div class="center-panel">
            <h2 class="bets-title"></h2>

            <!-- Botão Voltar -->
            <div id="voltarContainer" style="display: none;">
                <button class="button-novo" onclick="showUserCards()">Voltar para Cartões</button>
            </div>
        </div>
    </div>

    <script src="js/usuarios/usuarios.js" defer></script>
    <script src="js/tokens/tokens.js" defer></script>
    <script src="js/resultados_financeiros/resultados_financeiros.js" defer></script>
    <script src="js/resultados_financeiros/resultados_financeiros_detalhes.js" defer></script>
    <script src="js/resultados_financeiros/resultados_financeiros_novo.js" defer></script>
    <script src="js/autenticacao/autenticacao.js" defer></script>
    <script src="js/usuarios/criar_novo_usuario.js" defer></script>
    <script src="js/usuarios/usuarios_detalhes.js" defer></script>
    <script src="script.js" defer></script>

    <script>
        function openChangePasswordModal() {
            const modalHtml = `
                <div id="passwordModal" style="display: block;">
                    <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                        <h2>Alterar Senha</h2>
                        <input type="password" id="newPassword" placeholder="Nova Senha" required />
                        <button onclick="changePassword()">Salvar</button>
                        <button onclick="closePasswordModal()">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            if (modal) {
                modal.remove();
            }
        }

        function changePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const firstUserId = document.querySelector('.user-card').getAttribute('data-id');

            if (newPassword) {
                fetch(`/api/usuarios/${firstUserId}/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: newPassword }),
                })
                .then(response => {
                    if (response.ok) {
                        alert('Senha alterada com sucesso!');
                        closePasswordModal();
                    } else {
                        alert('Erro ao alterar a senha.');
                    }
                })
                .catch(error => {
                    console.error('Erro ao alterar a senha:', error);
                    alert('Erro ao alterar a senha.');
                });
            } else {
                alert('Por favor, digite uma nova senha.');
            }
        }

        // Função para criar um novo usuário
        function createUser() {
            const nome = document.getElementById('nome').value; // Obtenha o nome do campo de entrada
            const email = document.getElementById('email').value; // Obtenha o email do campo de entrada
            const password = document.getElementById('newUserPassword').value; // Obtenha a senha do campo de entrada

            fetch('/api/usuarios', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ nome, email, password }),
            })
            .then(response => {
                if (response.ok) {
                    alert('Usuário criado com sucesso!');
                    loadUsers(); // Recarrega a lista de usuários após a criação
                } else {
                    alert('Erro ao criar usuário.');
                }
            })
            .catch(error => {
                console.error('Erro ao criar usuário:', error);
                alert('Erro ao criar usuário.');
            });
        }
    </script>
</body>
</html>
