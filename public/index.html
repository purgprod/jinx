<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">	
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container Principal -->
    <div class="container" id="main-container">
        <!-- Divisão da esquerda -->
        <div class="left-panel">
            <h1 class="purg-title">Jinx</h1>
            <button id="usuariosButton" class="config-button">Usuários</button>
            <button id="resultadosButton" class="config-button">Resultados Financeiros</button>
            <button id="pinsButton" class="config-button">Pins</button>
            <button id="ecossistemaButton" class="config-button">Ecossistema</button>
	    <!-- <button id="receitasButton" class="config-button">Receitas</button> -->
            <button id="assinaturasButton" class="config-button">Assinaturas</button>
            <button id="emblemasButton" class="config-button">Emblemas</button>
            <button id="rankingButton" class="config-button">Ranking</button>
            <button id="luluButton" class="config-button">Lulu</button>
            <button id="saquesButton" class="config-button">Saques</button>
            <button id="depositosButton" class="config-button">Depositos</button>
            <button id="rotinasButton" class="config-button">Rotinas</button>
            <button id="adminButton" class="config-button">Admin</button>
            <!-- Botão Sair -->
            <button id="logoutButton" class="logout-button">Sair</button>
        </div>

        <!-- Divisão central para exibir as informações -->
        <div class="center-panel">
            <h2 class="page-title"></h2>

            <!-- Botão Voltar -->
            <div id="voltarContainer" style="display: none;">
                <button class="button-novo" onclick="showUserCards()">Voltar para Cartões</button>
            </div>
        </div>
    </div>

    <!-- Carregar Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.5.1"></script>
    <!-- Carregar uma versão compatível do ChartDataLabels com Chart.js 3.x -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

    <script src="js/usuarios/usuarios.js" defer></script>
    <script src="js/tokens/tokens.js" defer></script>
    <script src="js/tokens/tokens_detalhes.js" defer></script>
    <script src="js/resultados_financeiros/resultados_financeiros.js" defer></script>
    <script src="js/resultados_financeiros/resultados_financeiros_detalhes.js" defer></script>
    <script type="module" src="js/resultados_financeiros/resultados_financeiros_novo.js" defer></script>
    <script src="js/autenticacao/autenticacao_jinx.js" defer></script>
    <script src="js/usuarios/criar_novo_usuario.js" defer></script>
    <script type="module" src="js/ecossistema/ecossistema.js" defer></script>
    <script type="module" src="js/receitas/receitas.js" defer></script>
    <script type="module" src="js/rotinas/rotinas.js" defer></script>
    <script type="module" src="js/assinaturas/assinaturas.js" defer></script>
    <script type="module" src="js/emblemas/emblemas.js" defer></script>
    <script src="js/saques/saques.js" defer></script>
    <script src="js/depositos/depositos.js" defer></script>
    <script src="js/ranking/ranking.js" defer></script>
    <script src="js/lulu/lulu.js" defer></script>
    <script type="module" src="js/usuarios/usuarios_detalhes.js" defer></script>
    <script src="js/admin/admin.js" defer></script>
    <script src="script.js" defer></script>

</body>
</html>
