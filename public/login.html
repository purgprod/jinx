<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fade-in">
    <div class="container-login">
        <div id="login-container" class="login-container">
            <h1>Jinx</h1>
            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="purg@purg.com.br" required>
                
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="******" required>
                
                <button type="submit">Entrar</button>
                <p id="error-message" style="display:none;">Credenciais inválidas. Tente novamente.</p>
            </form>
        </div>
    </div>

    <script src="autenticacao.js" defer></script> <!-- Incluindo o script da autenticação -->
</body>
</html>
